spring:
    application:
        name: ai_gym
    datasource:
        url: jdbc:mysql://localhost:3306/ai_gym?serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
        username: root
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
            connection-init-sql: "SET time_zone = '+00:00'"
    jackson:
        time-zone: UTC
    ai:
        openai:
            api-key: ${DEEPSEEK_API_KEY}
            base-url: https://api.q.ibrain-us.cn

server:
    port: 8080

security:
    jwt:
        issuer: smart-gym
        secret: ${JWT_SECRET}
        access-token-ttl-seconds: 900
        refresh-token-ttl-seconds: 2592000

mybatis-plus:
    mapper-locations: classpath:/mapper/**/*.xml
    configuration:
        map-underscore-to-camel-case: true

logging:
    pattern:
        level: "%5p [traceId=%X{traceId:-none}]"
